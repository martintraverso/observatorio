name: Instalar tippecanoe
description: tippecanoe en la versión exacta fijada (las teselas cambian entre versiones). Usa apt si trae esa versión; si no, compila el tag (con cache).
inputs:
  version:
    description: versión exacta (tag de felt/tippecanoe); la misma que se usa en local
    default: "2.53.0"
runs:
  using: composite
  steps:
    - name: Cache del binario compilado
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.tippecanoe
        key: tippecanoe-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Instalar
      shell: bash
      run: |
        set -euo pipefail
        alcanza() { command -v tippecanoe >/dev/null && tippecanoe --version 2>&1 | grep -qx "tippecanoe v${{ inputs.version }}"; }
        export PATH="$HOME/.tippecanoe/bin:$PATH"
        if ! alcanza; then
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe || true
        fi
        if ! alcanza; then
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 --branch "${{ inputs.version }}" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" PREFIX="$HOME/.tippecanoe" install >/dev/null
        fi
        alcanza
        echo "$HOME/.tippecanoe/bin" >> "$GITHUB_PATH"
        tippecanoe --version
