name: CI · lint y tests

# En cada push y pull request: ruff + pytest sobre el fixture (tests/fixtures/),
# incluido pipeline/web.py con PMTiles (tippecanoe).
# No necesita el zip original del INE.
on:
  push:
    branches: ["**"]  # solo ramas: los tags de releases (crudos, datos-…) no disparan CI
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - uses: ./.github/actions/tippecanoe

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Tests (fixture)
        env:
          OBS_DATOS: fixture
          OBS_REQUIERE_PMTILES: "1"
        run: pytest -q
