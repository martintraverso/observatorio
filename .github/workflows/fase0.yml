name: Fase 0 · territorios INE 2023

# Corre a mano (Actions > Run workflow) y una vez por semana.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC

permissions:
  contents: write

jobs:
  territorios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El original se guarda como asset del release "crudos" (la descarga del INE
      # a veces falla). Si no está, se intenta bajar del INE.
      - name: Conseguir el archivo original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p datos/crudo
          gh release download crudos -p "Unidades_Geoestadisticas_Censo_2023.zip" -D datos/crudo \
            || curl -fL --retry 3 -o datos/crudo/Unidades_Geoestadisticas_Censo_2023.zip \
               "https://www5.ine.gub.uy/documents/CENSO%202023/Cartografia/Vectoriales/Unidades%20Geoestadisticas%20Censo%202023.zip"
          sha256sum datos/crudo/*.zip

      - name: Procesar
        run: python pipeline/territorios_2023.py datos/crudo/Unidades_Geoestadisticas_Censo_2023.zip --salida datos/salida

      - name: Probar
        run: pytest -q

      - name: Publicar resultados en el release "datos"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd datos/salida
          zip -qr web.zip web
          gh release view datos >/dev/null 2>&1 || gh release create datos --title "Datos procesados" --notes "Salida del pipeline. Se reemplaza en cada corrida."
          gh release upload datos observaciones.parquet territorios.parquet correspondencias.parquet \
            indicadores.parquet capturas.parquet fuentes.parquet reporte_validacion.md web.zip --clobber
          cat reporte_validacion.md >> "$GITHUB_STEP_SUMMARY"
