name: Datos · procesar y publicar

# Baja los originales (release "crudos", o la URL de la fuente), procesa las fuentes
# activas, prueba con los datos completos y publica un release "datos-AAAAMMDD-HHMMSS"
# marcado como latest. Si algo falla, el latest anterior queda intacto (AC-A3).
#
# - Manual: Actions > "Datos · procesar y publicar" > Run workflow (opción "forzar").
# - Semanal: lunes 06:17 UTC; si los originales no cambiaron, solo actualiza el historial.
# - Al mergear a main cambios en el pipeline o en fuentes/: reprocesa (forzar).
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Reprocesar aunque los originales no hayan cambiado"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "fuentes/**"
      - "requirements.txt"
      - ".github/actions/tippecanoe/**"  # otra versión de tippecanoe cambia las teselas

permissions:
  contents: write  # crear releases
  issues: write    # F4.6 (#169): «Nuevo anuario MEC <año>: revisar mapeo»

concurrency:
  group: datos     # nunca dos publicaciones a la vez
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      FORZAR: ${{ github.event_name == 'push' || inputs.forzar == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - uses: ./.github/actions/tippecanoe

      - name: Bajar la publicación anterior (historial y salidas)
        run: python scripts/publicar.py bajar --salida datos/salida

      - name: Conseguir originales
        run: python scripts/conseguir_originales.py --crudo datos/crudo

      # F3.6 (#130, AC-I19): las planillas de ingresos del INE se capturan en cada corrida. Una planilla que da
      # error queda en el registro y no frena nada; una que cambió es una captura nueva, que «Procesar» carga.
      # Si el INE no responde, la corrida sigue con lo que ya está en crudos (el registro se escribe después de cada
      # planilla y «Procesar» verifica los sha256).
      - name: Capturar ingresos (INE)
        timeout-minutes: 15
        continue-on-error: true
        run: python pipeline/ech_ingresos_captura.py --crudo datos/crudo | tee -a "$GITHUB_STEP_SUMMARY"

      # Lo nuevo va a «crudos» antes de procesar: los originales quedan guardados aunque después algo falle.
      # Sin capturas nuevas no sube nada (el registro solo cambió en ultima_corrida).
      - name: Subir originales nuevos de ingresos a crudos
        run: python scripts/crudos_carpeta.py subir --crudo datos/crudo --carpeta ech_ingresos

      # F4.6 (#169, AC-E25): los anuarios del MEC. Un archivo cambiado en la URL del registro es otra captura vigente,
      # que «Procesar» carga. Un año nuevo se baja a mec_anuario/nuevos/ sin cargarse (no entra en capturas.json ni se
      # sube a «crudos»: el issue lleva su URL y sha256) y abre una sola vez «Nuevo anuario MEC <año>: revisar mapeo».
      # Un año del registro con otra URL en su página abre «Anuario MEC <año> actualizado: revisar URL». Si el MEC no
      # responde, el paso falla (pipefail) y la corrida sigue.
      - name: Capturar anuarios (MEC)
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: python pipeline/mec_anuario_captura.py --crudo datos/crudo | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Novedades del MEC (años nuevos y URL cambiadas)
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        run: python pipeline/mec_anuario_novedades.py --crudo datos/crudo --issues | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Subir capturas nuevas del MEC a crudos
        run: python scripts/crudos_carpeta.py subir --crudo datos/crudo --carpeta mec_anuario

      - name: Procesar
        run: |
          python pipeline/correr.py --crudo datos/crudo --salida datos/salida \
            --resumen resumen.json $([ "$FORZAR" = "true" ] && echo --forzar)
          echo "publicar=$(python -c 'import json; print(str(json.load(open("resumen.json"))["publicar"]).lower())')" >> "$GITHUB_OUTPUT"
        id: procesar

      - name: Probar (datos completos)
        if: steps.procesar.outputs.publicar == 'true'
        env:
          OBS_DATOS: completo
          OBS_REQUIERE_PMTILES: "1"
        run: pytest -q

      - name: Publicar
        run: python scripts/publicar.py subir --salida datos/salida --resumen resumen.json

      - name: Reporte de validación
        if: always()
        run: |
          [ -f datos/salida/reporte_validacion.md ] && cat datos/salida/reporte_validacion.md >> "$GITHUB_STEP_SUMMARY" || true
