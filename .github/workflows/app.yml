name: App · build y deploy a GitHub Pages

# Arma el sitio estático con los datos del último release "datos-…" y lo publica en GitHub Pages.
# - Al mergear a main cambios en app/.
# - Cuando termina bien una corrida de "Datos · procesar y publicar" (AC-A4).
# - A mano: Actions > "App · build y deploy a GitHub Pages" > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_run:
    workflows: ["Datos · procesar y publicar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Datos del último release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern web.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/web.zip" -d "$RUNNER_TEMP/web"
          echo "Datos: $(gh release list --repo '${{ github.repository }}' --json tagName,isLatest -q '.[] | select(.isLatest) | .tagName')" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          DATOS_WEB: ${{ runner.temp }}/web
          VITE_REPOSITORIO: ${{ github.repository }}
        run: npm run build

      # Chromium, Firefox y WebKit (Safari): AC-G4
      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Tests e2e sobre el sitio armado
        run: npm run test:e2e

      - name: Lighthouse sobre el sitio armado (AC-G6)
        run: |
          node scripts/servidor-pages.mjs build 4173 &
          sleep 1
          npm run test:lighthouse -- http://localhost:4173/${{ github.event.repository.name }}/ 3

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
