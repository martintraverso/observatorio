# Indicadores del mapa (#248, AC-V34/AC-V35): nombre corto, familia y apertura. Registro revisado: los nombres
# no salen del título del MEC. `familias`: el código del total y sus aperturas (dimensión y valor). `fuera_del_mapa`:
# indicadores con `mapa: true` por AC-V33 que no van a la lista, con el motivo (siguen en fichas y descargas).
# Un indicador con `mapa: true` que no está en ninguna de las dos listas hace fallar web.py.
familias:
  pob_total:
    nombre_corto: "Personas"
    aperturas:
      pob_hombres: {nombre_corto: "Personas: hombres", apertura: {"Sexo": "Hombres"}}
