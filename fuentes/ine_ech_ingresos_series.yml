# Registro de fuente: una entrada por dataset (AC-P9, AC-I18). Relevado en F3.1 (#125), 2026-11-20.
id: ine_ech_ingresos_series
nombre: Series históricas de ingresos de las personas y los hogares (ECH)
organismo: Instituto Nacional de Estadística (INE)
# Página oficial con los enlaces a todas las planillas. Las URL se toman de esta página, no se arman: hay dos
# carpetas («Ingresos de las personas y los hogares/» y «Ingresos 2024/») y la página mezcla enlaces a las dos.
pagina: https://www.gub.uy/instituto-nacional-estadistica/datos-y-estadisticas/estadisticas/series-historicas-ech-ingresos-personas-hogares
# Planilla del titular del INE (ver variante_titular). Todas las planillas: ver archivos.
url_descarga: https://www5.ine.gub.uy/documents/Demograf%C3%ADayEESS/SERIES%20Y%20OTROS/ECH/Series%20hist%C3%B3ricas/Ingresos%20de%20las%20personas%20y%20los%20hogares/ECHING10.xlsx
formato: >-
  Una planilla xlsx por cuadro, con una sola hoja. Título en las filas 1–3 (concepto, variante, base de precios,
  «Período: 2016 -»); encabezado en dos filas (fila 6: «Mes, Trimestre y Año», «Total Pais», «Montevideo», «Total»,
  «Localidades de», «Localidades Pequeñas»; fila 7: «5.000 o más hab.», «y Zonas rurales»; «Interior» combinado
  sobre las tres últimas columnas en la fila 5). Por cada año, una fila con el año (número), cuatro filas
  trimestrales («Enero - Marzo/16» … «Octubre - Diciembre/16») y una fila «Total 2016». Notas al pie al final.
  Cada archivo pesa 1,4–2,3 MB porque la hoja trae ~550.000 celdas vacías con formato (hasta la columna XFD).
# Texto público (fichas, /fuentes, fuentes.json). Mismo criterio que la otra fuente del INE (decisión del
# mantenedor del 2026-11-17, #83): el INE no publica una licencia para estas planillas.
licencia: "No publicada por el INE. Se cita la fuente según cada cuadro."
cita: "Fuente: Instituto Nacional de Estadística (INE). (pie de cada planilla)"
contacto: "Depto. de Difusión y Comunicación del INE: difusion@ine.gub.uy, (598) 2902 7303 int. 7723 y 7725 (pie de los informes trimestrales)."
frecuencia: trimestral desde 2016 (cada planilla se actualiza con un trimestre más; los totales anuales, al cerrar el año)
# en preparación hasta F3.4 (#128): la carga (cargar: true, script y carpeta_original) se agrega con el script
# que la hace. Con cargar: true sin script el registro no valida y el pipeline no corre (comun/registro.py).
estado: en preparación     # activa | en preparación | a relevar
carpeta_original: ech_ingresos
temas: [Ingresos]
# pais/UY, departamento/01 (solo Montevideo; ningún otro departamento ni nivel más chico, AC-I17) y las tres
# regiones del Interior (nivel region, sin geometría, F3.2 #126; ver columnas).
niveles_publicados: [pais, region, departamento]
nivel_mas_detallado: departamento

periodo: >-
  Trimestres calendario («Enero - Marzo/16» = 2016-01-01…2016-03-31) y años («Total 2016»). Las cifras son
  ingresos medios mensuales, en pesos por mes.

# Columna → territorio (AC-I7). El encabezado varía entre planillas: «Total Pais» (ECHING07–14, ECHINGRESOS3) o
# «Total País» (ECHINGRESOS2), y a veces con espacios de más («Mes, Trimestre y Año »).
columnas:
  Total Pais: pais/UY
  Total País: pais/UY
  Montevideo: departamento/01
  "Interior · Total": region/interior
  "Interior · Localidades de 5.000 o más hab.": region/interior-5000
  "Interior · Localidades Pequeñas y Zonas rurales": region/interior-menores

bases_de_precios:
  - "Precios corrientes: ECHING07–ECHING14."
  - "Precios de enero de 2005: ECHINGRESOS2 y ECHINGRESOS3 (solo sin aguinaldo y sin valor locativo), y los cuadros por fuente de ingreso."
  - "El observatorio no deflacta ni convierte: cada base de precios es un indicador distinto (docs/PLAN_ingresos.md)."

