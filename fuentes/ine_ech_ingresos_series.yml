notas_al_pie:
  # Texto del pie de las planillas (igual en todas las relevadas, salvo la numeración de las llamadas).
  - "Fuente: Instituto Nacional de Estadística (INE)."
  - "Nota: En algunos casos los promedios trimestrales pueden quedar mínimamente fuera de rango debido a los procedimientos de expansión."
  - "Las cifras presentadas están sujetas a revisión, en función del cierre anual de la base."
  - "Planillas de hogares: «(1): Cifras actualizadas a noviembre 2026.» (marca los dos primeros trimestres de 2026)."
  - "Planillas per cápita: «(1): Incluye ingresos del hogar.» (llamada del título) y «(2): Cifras actualizadas a noviembre 2026.»"

# Cambio de 2025: ingreso disponible ajustado (YDA). Determinado en F3.1 con material del INE, no supuesto.
cambio_2025_yda: >-
  Desde el informe del 1.er trimestre de 2025 el INE usa el ingreso disponible ajustado (YDA), que a diferencia del
  vector anterior no incluye las cuotas de salud imputadas por FONASA ni por Sanidad militar/policial (Nota
  aclaratoria del 16/05/2025). Las planillas 2016– se recalcularon enteras con el YDA: el informe del 1.er trimestre
  de 2025 dice que el nuevo vector «no es comparable con el utilizado previamente», que «se presentan series
  temporales para el período 2016-2025» y que «estas series difieren de las presentadas en informes anteriores».
  Comprobado: para el 4.º trimestre de 2024, el informe de ese trimestre (método anterior) da $95.182 y ECHING10 da
  $86.384, el mismo valor que el informe del 1.er trimestre de 2025 con el YDA. La serie es comparable dentro de sí
  misma desde 2016, pero no con cifras de informes anteriores a 2025.

notas:
  - Solo sitios oficiales del INE (www.gub.uy/instituto-nacional-estadistica y www5.ine.gub.uy) son fuentes válidas.
  - "El total de cada año es el promedio de sus cuatro trimestres, calculado en la propia planilla del INE."
  - "Las cifras de 2016–2025 se publican con todos los decimales; las de 2026, redondeadas a pesos."

# No se publica (no está en las columnas de la tabla `fuentes`, AC-V19).
notas_internas:
  - "Decisiones del mantenedor sobre las preguntas de F3.1 (PR #134, 2026-11-20): (a) los valores son por mes: unidad «pesos corrientes por mes» / «pesos de enero de 2005 por mes» (AC-I9), aunque ni las planillas ni los informes relevados lo digan; (b) los totales anuales se guardan (tipo_periodo anio, AC-I8) aunque sean el promedio de los trimestres calculado por la planilla; (c) los valores de 2026 se guardan tal cual, redondeados a enteros como vienen (AC-I10)."
  - "AC-I15 (total dentro de ±5 % del promedio de los trimestres) siempre da 0 % con estas planillas: el total es una fórmula =+AVERAGE de los cuatro trimestres."
  - "El nivel region (sin geometría) lo agregó F3.2 (#126); desde entonces está en niveles_publicados."
  - "/fuentes muestra «Departamento» como nivel más detallado aunque el INE solo publica Montevideo; la app todavía no conoce el nivel region (sin nombre, aparecería como «region»). Presentación: F3.7 (#131)."
  - "Fuente activa o no, la decide el mantenedor después de F3.5 (#129), como con la ECH de trabajo (#69)."
