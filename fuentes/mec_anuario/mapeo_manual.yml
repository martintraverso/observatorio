              Maldonado-Rivera, Maldonado-Rocha, Maldonado-Salto, Maldonado-Treinta y Tres, Paysandú-Rivera, Paysandú-Salto,
              Montevideo-Paysandú, Montevideo-Rivera, Montevideo-Salto, Montevideo-San José, MONTEVIDEO Y RESTO DEL PAÍS]
  II-7.1.2:
    categorias: [PÚBLICO, PRIVADO]
    nombres: [UdelaR, UTEC, UTEC (Montevideo-Virtual), UCU, Universidad ORT Uruguay, Universidad de Montevideo,
              Universidad de la Empresa, Universidad CLAEH, CLAEH, APU-Inst Univ de Postgrado en Psicoanálisis,
