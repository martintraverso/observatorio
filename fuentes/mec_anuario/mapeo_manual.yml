    anios: [2024]
    patron: ""
    categorias: [universidad_de_la_empresa]
    motivo: "La Universidad de la Empresa en 2024 no se carga: el anuario repite su dato de 2023 (pie: «último disponible año 2023»), que ya se cargó con su año (D4, #255)."
  II-7.2.3:
