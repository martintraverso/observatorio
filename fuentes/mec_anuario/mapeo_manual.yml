# Mapeo a mano del anuario del MEC (F4.3b-1, #182). Lo aplica scripts/inventario_mec.py al regenerar
# fuentes/mec_anuario_educacion.yml. Subcarpeta a propósito: comun.registro solo lee fuentes/*.yml.
#
# anio_real (D4): columnas que el pie declara de otro año. `columnas` filtra por la ruta de encabezado
# (texto sin tildes ni mayúsculas que tiene que aparecer en la ruta) o `todas`. Si el anuario de ese año
# ya publica la misma ruta, la columna lleva `omitir` (lo ya cargado no se vuelve a cargar, mantenedor
# 2026-11-23) y el inventario compara los valores; si no, lleva `anio`.
anio_real:
  II-1.1.1:
    2021: {anio: 2020, columnas: privad}
    2022: {anio: 2020, columnas: privad}  # la nota de 2022 repite la de 2021: los valores lo deciden
  II-1.1.2:
    # el pie de 2021 dice que los CPIP (INAU) antes se llamaban «Centros Privados supervisados por el MEC»: el par
    # de 2020 es esa columna, con otro rótulo. Sus valores difieren (254 contra 264): se carga como 2021.
    2021: {anio: 2020, columnas: cpip, par: "Centro de Primera Infancia (Supervisados por MEC)"}
  II-1.2.1:
    2021: {anio: 2020, columnas: privad}
  II-1.2.3:
    2021: {anio: 2020, columnas: todas}  # cuadro de inicial privada: todo es privada
  II-2.1.1:
    2021: {anio: 2020, columnas: privad}
  II-2.1.4:
    2021: {anio: 2020, columnas: todas}  # establecimientos privados; además el título dice 2020
  II-2.2.1:
    2021: {anio: 2020, columnas: privad}
  II-2.2.15:
    2021: {anio: 2020, columnas: todas}  # rendimiento de primaria privada: todo es privada
    2022: {anio: 2020, columnas: todas}
    2023: {anio: 2020, columnas: todas}
  II-2.2.17:
    2021: {anio: 2020, columnas: privad}
    2022: {anio: 2020, columnas: privad}
    2023: {anio: 2020, columnas: privad}
  II-2.3.2:
    2023: {anio: 2022, columnas: todas}
    2024: {anio: 2022, columnas: todas}
  # II-2.2.18 2023 no es de otro año: no hay datos (todo «s/d»), lo resuelve el parser.

# total_con_error (D5): filas en las que el total general publicado no cierra con sus partes por un error de la
# fuente. Se guarda lo publicado y queda anotado; ninguna otra fila ni cuadro tiene tolerancia.
total_con_error:
  II-3.2.2:
    2021: Treinta y Tres  # 315 publicado contra 580 sumado
    2022: Treinta y Tres  # 320 publicado contra 477 sumado

# repetidas (D5): columnas con la misma ruta que otra. Estrategia por cuadro, comprobada con sumas en
# todas las filas de cada año:
#   derecha: la columna es el total del grupo que empieza a su derecha  -> <grupo>/TOTAL
#   izquierda: la columna es el total del grupo que termina a su izquierda -> <grupo>/TOTAL
#   padre: las columnas repetidas seguidas desglosan la columna no repetida de su izquierda -> <padre>/<rótulo>
repetidas:
  II-1.2.2: izquierda
  II-3.1.1: padre
  II-3.2.2: derecha
  II-3.2.7: derecha
  II-4.1.1: padre
  II-4.2.2: derecha
  II-4.2.4: padre

# renombres (D5): columnas cuyo encabezado en el archivo está mal; el concepto se decide comparando con los
# años vecinos. Clave: columna del archivo de ese año.
renombres:
  II-1.2.2:
    2021:
      motivo: >-
        el archivo repite «JARDÍN COMÚN» en R–U; esas columnas solo tienen datos en Montevideo y valores como los
        de «JARDÍN DE CICLO INICIAL» de 2022 (2021: 6/69/114/132; 2022: 0/58/108/111). M–P coinciden con el
        jardín común de 2020 y 2022.
      columnas:
        R: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/<= 2
        S: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/3
        T: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/4
        U: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/5

# conceptos (D5): rutas que la regla de encabezados (`completar_grupos`) deja mal, en todos los años en que
# aparecen. `suma`: rutas (o prefijos terminados en «/», o finales que empiezan con «*/») cuyas columnas tienen
# que sumar `total` (otra ruta del cuadro) o, si no hay `total`, la columna misma. Se comprueba en cada año y
# fila; `diferencia_explicada` acepta las filas que no cierran por lo que dice el pie, y lo anota.
conceptos:
  II-2.1.4:
    "TIPO DE EDUCACIÓN/Total":
      concepto: TIPO DE EDUCACIÓN/EDUCACIÓN COMÚN/TOTAL  # 2024: 372 = 354 habilitados + 18 autorizados
      suma: ["TIPO DE EDUCACIÓN/EDUCACIÓN COMÚN/"]
  II-1.2.3:
    "MODALIDAD/Total":
      concepto: MODALIDAD/JARDINES PRIVADOS/TOTAL  # 2024: 2.011 = suma de los niveles de jardines privados
      suma: ["MODALIDAD/JARDINES PRIVADOS/"]
      diferencia_explicada:  # filas que no cierran por algo que dice el pie
        2023: "24 estudiantes de jardines privados sin información por edad (pie): 15 en Montevideo y 9 en el resto"
  II-1.2.4:
    "FORMA DE ADMINISTRACIÓN/TOTAL/SEXO/MUJER":
      concepto: TOTAL/SEXO/MUJER  # hermana de C «TOTAL/SEXO/VARÓN»; 2024: 33.791 = 30.834 + 2.957
      suma: ["*/SEXO/M"]  # las mujeres de cada forma de administración
  II-4.2.14:
    "FORMA DE ADMINISTRACIÓN/TOTAL/NO PROMOVIDO/SEXO/Mujer":
      concepto: TOTAL/NO PROMOVIDO/SEXO/Mujer  # hermana de F «TOTAL/NO PROMOVIDO/SEXO/Varón»
      total: TOTAL/NO PROMOVIDO/TOTAL
      suma: ["TOTAL/NO PROMOVIDO/SEXO/", "FORMA DE ADMINISTRACIÓN/TOTAL/NO PROMOVIDO/SEXO/Mujer"]
  II-1.2.5:
    "Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato":
      concepto: FORMA DE ADMINISTRACIÓN/Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato
      total: TOTAL
      suma: ["FORMA DE ADMINISTRACIÓN/", "Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato"]

# reagrupaciones (D6): categorías de 2020–2023 que el anuario 2024 agrupa en otra. Decisión del mantenedor
# (2026-11-23): cada una conserva su indicador, tal como se publicó, con esta nota; nunca se suman.
reagrupaciones:
  II-1.2.1: &jardines
    jardin comun: "2024 la agrupa con «Jardín de Ciclo Inicial» en «JARDÍN DE INFANTES»"
    jardin de ciclo inicial: "2024 la agrupa con «Jardín común» en «JARDÍN DE INFANTES»"
    jardin de jornada comun y completa: "2024 publica por separado «JARDÍN DE INFANTES» y «JARDÍN DE JORNADA COMPLETA»"
    comun: &escuelas "2024 reclasifica las escuelas en «URBANA COMÚN», «RURAL», «TIEMPO COMPLETO» y «TIEMPO EXTENDIDO»"
    con maestro a cargo: *escuelas
    de practica: *escuelas
    habilitada de practica: *escuelas
    internado rural: *escuelas
    t.extendido-de practica: *escuelas
    unidocente: *escuelas
    de tiempo completo: *escuelas
  II-1.2.2: *jardines

# desgloses_extra (F4.5a, AC-E19): partes de un total que el encabezado no dice (rutas del archivo o conceptos).
desgloses_extra:
  II-3.2.10:  # #196: el total de cada sexo y resultado = la suma de los tipos de curso (2024 no cierra y no se carga)
    - total: RENDIMIENTO/Promovido/SEXO/Varón
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/Promovido/SEXO/Varón", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/Promovido/SEXO/Varón", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/Promovido/SEXO/Varón"]
    - total: RENDIMIENTO/Promovido/SEXO/Mujer
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/Promovido/SEXO/Mujer", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/Promovido/SEXO/Mujer", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/Promovido/SEXO/Mujer"]
    - total: RENDIMIENTO/No Promovido/SEXO/Varón
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/No promovido/SEXO/Varón", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/No promovido/SEXO/Varón", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/No promovido/SEXO/Varón"]
    - total: RENDIMIENTO/No Promovido/SEXO/Mujer
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/No promovido/SEXO/Mujer", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/No promovido/SEXO/Mujer", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/No promovido/SEXO/Mujer"]
  II-1.2.4:  # el TOTAL es varones + mujeres + los «sin dato» de CPIP (columna dentro de CPIP)
    - total: TOTAL
      partes: ["TOTAL/SEXO/VARÓN", "TOTAL/SEXO/MUJER", "FORMA DE ADMINISTRACIÓN/Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato"]

# particiones (F4.5a, AC-E19): cuadros B con filas jerárquicas; cada regla es [total, [partes]] (categorías del id).
particiones:
  II-3.2.1:
    - [total, [media_basica_publica, media_basica_privada]]
    - [media_basica_publica, [diurna, nocturna]]
  II-4.2.1:
    - [total, [media_superior_publica, media_superior_privada]]
    - [media_superior_publica, [diurna, cuarto_turno]]

# huecos (F4.5a, AC-E21): territorios que faltan en un cuadro A sin que el anuario los publique sin dato.
# Hoy ninguno: todo lo que falta está publicado como «s/d» o «-».
huecos: {}

# controles_excepciones (F4.5a): lo publicado no cierra y se guarda tal cual. Cada excepción está acotada a sus
# indicadores (y territorios, si los dice) y su motivo dice lo que muestra el archivo; el control la reporta como
# advertencia. Una falla en otro indicador o territorio del mismo cuadro y año frena la carga.
controles_excepciones:
  AC-E17:  # Montevideo + 18 departamentos = TOTAL (el país)
    II-1.1.1:
      2020:
        motivo: "el país publicado tiene 2 establecimientos públicos menos que la suma de los departamentos (total 251 contra 253)"
        indicadores: [edu_ii_1_1_1_total, edu_ii_1_1_1_forma_de_administracion_publica_total_publico, edu_ii_1_1_1_forma_de_administracion_publica_aprender]
    II-1.2.3:
      2023:
        motivo: "el país publicado no es la suma de los departamentos (total 18.045 contra 17.972)"
        indicadores: [edu_ii_1_2_3_total, edu_ii_1_2_3_modalidad_jardines_privados_total, edu_ii_1_2_3_modalidad_inicial_en_colegios_total]
    II-1.2.4:
      2024:
        motivo: "el total de mujeres publicado para el país (33.791) está 2.117 por debajo de la suma de los departamentos (35.908)"
        indicadores: [edu_ii_1_2_4_total_sexo_mujer]
    II-3.2.2:
      2021:
        motivo: "la fila de Treinta y Tres no cierra en el archivo: el país (36.214) no es la suma de los departamentos (35.949)"
        indicadores: [edu_ii_3_2_2_total_sin_privados]
      2022:
        motivo: "la fila de Treinta y Tres no cierra en el archivo: el país (33.210) no es la suma de los departamentos (33.053)"
        indicadores: [edu_ii_3_2_2_total_sin_privados]
    II-4.2.13:
      2023:
        motivo: "el país publicado no es la suma de los departamentos (promovidos 37.131 contra 34.226; no promovidos 12.366 contra 10.992)"
        indicadores: [edu_ii_4_2_13_rendimiento_promovido, edu_ii_4_2_13_rendimiento_no_promovido]
  AC-E19:  # desgloses
    II-1.2.1:
      2023:
        motivo: "el total no es varones + mujeres en el archivo (país 95.709 contra 95.597)"
        indicadores: [edu_ii_1_2_1_forma_de_administracion_total]
        territorios: [pais/UY, region/interior, departamento/01, departamento/03, departamento/05, departamento/10, departamento/11, departamento/13, departamento/16, departamento/18]
    II-1.2.4:
      2024:
        motivo: "el TOTAL publicado para el país (71.218) no es varones + mujeres + sin dato (69.101); en los departamentos sí cierra"
        indicadores: [edu_ii_1_2_4_total]
        territorios: [pais/UY]
    II-1.2.5:
      2020:
        motivo: "el total por sexo publicado no es la suma por edad (mujeres 97.051 contra 97.084; varones 92.669 contra 92.692)"
        indicadores: [edu_ii_1_2_5_sexo_m, edu_ii_1_2_5_sexo_v, edu_ii_1_2_5_forma_de_administracion_privados_mec_sexo_m, edu_ii_1_2_5_forma_de_administracion_privados_mec_sexo_v]
        territorios: [pais/UY]
    II-2.2.1:
      2023:
        motivo: "varones + mujeres no da el total en el archivo (país: total 287.805 contra 287.610; privada 45.558 contra 45.363)"
        indicadores: [edu_ii_2_2_1_total, edu_ii_2_2_1_forma_de_administracion_privada_total]
        territorios: [pais/UY, region/interior, departamento/01, departamento/03, departamento/05, departamento/06, departamento/10, departamento/13]

# cuadros_sin_cargar (#196): cuadros-año que el archivo publica mal y no se cargan (decisión del mantenedor).
cuadros_sin_cargar:
  II-3.2.10:
    2024: "en el archivo, el TOTAL y «Articulación» son iguales en las 21 filas y «EBI» los repite en el Interior y los 18 departamentos (Articulación pasa de 2.549 promovidos en 2023 a 18.529); no se carga el cuadro de 2024 (mantenedor, #196)"
