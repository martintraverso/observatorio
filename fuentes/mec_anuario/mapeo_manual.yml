# Mapeo a mano del anuario del MEC (F4.3b-1, #182). Lo aplica scripts/inventario_mec.py al regenerar
# fuentes/mec_anuario_educacion.yml. Subcarpeta a propósito: comun.registro solo lee fuentes/*.yml.
#
# anio_real (D4): columnas que el pie declara de otro año. `columnas` filtra por la ruta de encabezado
# (texto sin tildes ni mayúsculas que tiene que aparecer en la ruta) o `todas`. Si el anuario de ese año
# ya publica la misma ruta, la columna lleva `omitir` (lo ya cargado no se vuelve a cargar, mantenedor
# 2026-11-23) y el inventario compara los valores; si no, lleva `anio`.
anio_real:
  II-1.1.1:
    2021: {anio: 2020, columnas: privad}
    2022: {anio: 2020, columnas: privad}  # la nota de 2022 repite la de 2021: los valores lo deciden
  II-1.1.2:
    # el pie de 2021 dice que los CPIP (INAU) antes se llamaban «Centros Privados supervisados por el MEC»: el par
    # de 2020 es esa columna, con otro rótulo. Sus valores difieren (254 contra 264): se carga como 2021.
    2021: {anio: 2020, columnas: cpip, par: "Centro de Primera Infancia (Supervisados por MEC)"}
  II-1.2.1:
    2021: {anio: 2020, columnas: privad}
  II-1.2.3:
    2021: {anio: 2020, columnas: todas}  # cuadro de inicial privada: todo es privada
  II-1.2.5:
    2021: {anio: 2020, columnas: dgeip-privad}  # #229: el pie nombra solo «Privada del DGEIP»; los CPIP son de 2021 (D4)
  II-2.1.1:
    2021: {anio: 2020, columnas: privad}
  II-2.1.4:
    2021: {anio: 2020, columnas: todas}  # establecimientos privados; además el título dice 2020
  II-2.2.1:
    2021: {anio: 2020, columnas: privad}
  II-2.2.15:
    2021: {anio: 2020, columnas: todas}  # rendimiento de primaria privada: todo es privada
    2022: {anio: 2020, columnas: todas}
    2023: {anio: 2020, columnas: todas}
  II-2.2.17:
    2021: {anio: 2020, columnas: privad}
    2022: {anio: 2020, columnas: privad}
    2023: {anio: 2020, columnas: privad}
  II-2.3.2:
    2023: {anio: 2022, columnas: todas}
    2024: {anio: 2022, columnas: todas}
  # F4.8a1 (#224): la ola 2 de inicial y primaria, con las mismas notas que la ola 1
  II-1.3.2:
    2023: {anio: 2022, columnas: todas}  # «último año disponible… (año 2022)»
    2024: {anio: 2022, columnas: todas}
  II-2.2.6:
    2021: {anio: 2020, columnas: todas}  # matrícula de primaria privada: todo es privada
  II-2.2.10:
    2021: {anio: 2020, columnas: todas}  # primaria común privada
  II-2.2.11:
    2021: {anio: 2020, columnas: privad}
  II-2.2.12:
    2021: {anio: 2020, columnas: privad}
    # 2022 y 2023 repiten la nota «Privada… año 2020». El anuario 2020 no publica estas columnas, así que se comparan
    # con las del anuario 2021 (que son las de 2020): 2022 es igual en las 98 celdas y no se vuelve a cargar; 2023
    # difiere (4 de 50 iguales) y queda en 2023 con su nota (D4).
    2022: {anio: 2021, columnas: privad}
    2023: {anio: 2021, columnas: privad}
  # II-2.2.18 2023 no es de otro año: no hay datos (todo «s/d»), lo resuelve el parser.
  # F4.8c (#173): formación en educación
  II-6.3.2:
    2024: {anio: 2023, columnas: todas}  # «último dato disponible año 2023»: igual al anuario 2023, no se vuelve a cargar

# total_con_error (D5): filas en las que el total general publicado no cierra con sus partes por un error de la
# fuente. Se guarda lo publicado y queda anotado; ninguna otra fila ni cuadro tiene tolerancia.
total_con_error:
  II-3.2.2:
    2021: Treinta y Tres  # 315 publicado contra 580 sumado
    2022: Treinta y Tres  # 320 publicado contra 477 sumado
  II-5.2.2:  # #172: el total de la DGETP no es varones + mujeres en el archivo
    2023: DGETP  # MATRICULADOS: 13.749 publicado contra 14.848 sumado
    2024: DGETP  # INGRESADOS: 9.845 publicado contra 9.861 sumado
  II-5.3.1:  # #172: «Con postgrado de especialización» trae 0 en el total de 21 a 30 horas y varones en el tramo
    2021: Con postgrado de especialización o maestría  # Escuela Naval, 0 publicado contra 8 sumado
    2022: Con postgrado de especialización o maestría  # Escuela Naval, 0 publicado contra 8 sumado
    2024: Con postgrado de especialización o maestría  # Escuela Naval, 0 publicado contra 1 sumado

# repetidas (D5): columnas con la misma ruta que otra. Estrategia por cuadro, comprobada con sumas en
# todas las filas de cada año:
#   derecha: la columna es el total del grupo que empieza a su derecha  -> <grupo>/TOTAL
#   izquierda: la columna es el total del grupo que termina a su izquierda -> <grupo>/TOTAL
#   padre: las columnas repetidas seguidas desglosan la columna no repetida de su izquierda -> <padre>/<rótulo>
repetidas:
  II-1.2.2: izquierda
  II-2.2.12: derecha  # #224: «TOTAL» de PROMOVIDOS (B) y de NO PROMOVIDOS (E), cada uno del grupo a su derecha
  II-3.1.1: padre
  II-3.2.2: derecha
  II-3.2.7: derecha
  II-4.1.1: padre
  II-4.2.2: derecha
  II-4.2.4: padre
  II-5.2.1: derecha  # #172: «TOTAL» de INGRESADOS, MATRICULADOS y EGRESADOS, cada uno del grupo a su derecha
  II-5.2.2: derecha
  II-5.3.1: derecha  # #172: «HORAS SEMANALES/Total» de cada tramo de horas, a su derecha
  II-5.3.2: derecha
  II-6.2.2: derecha  # #173: «TOTAL» de INGRESADOS, MATRICULADOS y EGRESADOS, cada uno del grupo a su derecha
  II-6.2.3: derecha
  II-6.3.2: derecha  # #173: «HORAS SEMANALES/Total» de cada tramo de horas, a su derecha
  II-7.1.1: derecha  # #241: «TOTAL» de INGRESO, MATRÍCULA y EGRESO, cada uno del grupo a su derecha
  II-7.1.2: derecha
  II-7.2.1: derecha  # #255: «TOTAL» de INGRESO, MATRÍCULA y EGRESO, cada uno del grupo a su derecha
  II-7.2.2: derecha
  II-7.2.3: derecha

# renombres (D5): columnas cuyo encabezado en el archivo está mal; el concepto se decide comparando con los
# años vecinos. Clave: columna del archivo de ese año.
renombres:
  II-1.2.2:
    2021:
      motivo: >-
        el archivo repite «JARDÍN COMÚN» en R–U; esas columnas solo tienen datos en Montevideo y valores como los
        de «JARDÍN DE CICLO INICIAL» de 2022 (2021: 6/69/114/132; 2022: 0/58/108/111). M–P coinciden con el
        jardín común de 2020 y 2022.
      columnas:
        R: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/<= 2
        S: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/3
        T: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/4
        U: PÚBLICA/EDUCACIÓN DE INICIAL/JARDÍN DE CICLO INICIAL/AÑOS/5
  II-6.2.2:
    2024:
      motivo: >-
        el sexo es «s/d» en todo el cuadro y los tres «TOTAL» no se pueden probar con la suma; están en el mismo lugar
        que en 2020–2023, donde sí suman su grupo de la derecha (B = C + D, E = F + G, H = I + J).
      columnas:
        B: INGRESADOS/TOTAL
        E: MATRICULADOS/TOTAL
        H: EGRESADOS/TOTAL
  # #241: en II-7.1.1 el TOTAL de MATRÍCULA no es V + M: parte de la matrícula de la UdelaR no tiene sexo (pie). Además,
  # 2024 rotula «INGRESO/MATRÍCULA/EGRESO» lo que 2020–2023 rotulan «EGRESADOS» (II-7.1.1) o «INGRESADOS/MATRICULADOS/
  # EGRESADOS» (II-7.1.2): mismo cuadro y misma medida, con los conceptos de 2024 (D6).
  II-7.1.1:
    2020: &ii_7_1_1_hasta_2023
      motivo: >-
        el TOTAL de MATRÍCULA (E) no es la suma de varones y mujeres: incluye la matrícula de la UdelaR sin sexo (pie: «no
        se dispone de la matrícula desagregada por sexo»). En 2024 el total de cada territorio es varones + mujeres: otro
        alcance, otro id (AC-E13, mantenedor en #241). Está en el mismo lugar que los TOTAL de INGRESO y EGRESO, que sí suman
        su grupo. «EGRESADOS» es el «EGRESO» de 2024: mismo cuadro y misma medida.
      columnas:
        E: MATRÍCULA/TOTAL con sin sexo
        H: EGRESO/TOTAL
        I: EGRESO/SEXO/V
        J: EGRESO/SEXO/M
    2021: *ii_7_1_1_hasta_2023
    2022: *ii_7_1_1_hasta_2023
    2023: *ii_7_1_1_hasta_2023
    2024:
      motivo: >-
        en las filas de la UdelaR el TOTAL de MATRÍCULA (E) no es la suma de varones y mujeres (matrícula sin sexo, pie);
        en las de territorio sí lo es. Está en el mismo lugar que los TOTAL de INGRESO y EGRESO, que suman su grupo.
      columnas:
        E: MATRÍCULA/TOTAL
  II-7.2.1:
    2020: &ii_7_2_1_hasta_2023
      motivo: >-
        «INGRESADOS», «MATRICULADOS» y «EGRESADOS (UdelaR datos preliminares)» son el «INGRESO», la «MATRÍCULA» y el
        «EGRESO» de 2024: mismo cuadro y misma medida (#255). El TOTAL de matrícula incluye a los estudiantes de la UdelaR
        sin sexo en todos los años (pie): no es varones + mujeres, y no cambia de alcance entre años.
      columnas: &ii_7_2_x
        B: INGRESO/TOTAL
        C: INGRESO/SEXO/V
        D: INGRESO/SEXO/M
        E: MATRÍCULA/TOTAL
        F: MATRÍCULA/SEXO/V
        G: MATRÍCULA/SEXO/M
        H: EGRESO/TOTAL
        I: EGRESO/SEXO/V
        J: EGRESO/SEXO/M
    2021: *ii_7_2_1_hasta_2023
    2022: *ii_7_2_1_hasta_2023
    2023: *ii_7_2_1_hasta_2023
    2024:
      motivo: >-
        los tres «TOTAL» son el de INGRESO, MATRÍCULA y EGRESO a su derecha; el de matrícula incluye a los estudiantes
        de la UdelaR sin sexo (pie), por eso no es la suma de su grupo (#255).
      columnas: *ii_7_2_x
  II-7.2.2:
    2020: &ii_7_2_2_hasta_2023
      motivo: >-
        «INGRESADOS», «MATRICULADOS» y «EGRESADOS» son el «INGRESO», la «MATRÍCULA» y el «EGRESO» de 2024: mismo cuadro
        y misma medida (#255).
      columnas: *ii_7_2_x
    2021: *ii_7_2_2_hasta_2023
    2022: *ii_7_2_2_hasta_2023
    2023: *ii_7_2_2_hasta_2023
    2024:
      motivo: >-
        los tres «TOTAL» son el de INGRESO, MATRÍCULA y EGRESO a su derecha. Una fila de departamento (Maldonado, de
        la CLAEH, que no se carga) no suma su grupo y deja la comprobación sin probar (#255).
      columnas: *ii_7_2_x
  II-7.2.3:
    2020: *ii_7_2_2_hasta_2023
    2021: *ii_7_2_2_hasta_2023
    2022: *ii_7_2_2_hasta_2023
    2023: *ii_7_2_2_hasta_2023
    2024:
      motivo: los tres «TOTAL» son el de INGRESO, MATRÍCULA y EGRESO a su derecha (#255).
      columnas: *ii_7_2_x
  II-7.1.2:
    2020: &ii_7_1_2_hasta_2022
      motivo: >-
        «INGRESADOS» y «EGRESADOS» son el «INGRESO» y el «EGRESO» de 2024: mismo cuadro y misma medida. La matrícula de
        2020–2022 incluye a la UdelaR con el «I Censo de Estudiantes de Posgrado 2012» (6.802 en Montevideo, los tres
        años); desde 2023 la UdelaR viene sin dato: otro alcance, otro id (AC-E13, mantenedor en #241).
      columnas:
        B: INGRESO/TOTAL
        C: INGRESO/SEXO/V
        D: INGRESO/SEXO/M
        E: MATRÍCULA/TOTAL con UdelaR censo 2012
        F: MATRÍCULA/SEXO/V con UdelaR censo 2012
        G: MATRÍCULA/SEXO/M con UdelaR censo 2012
        H: EGRESO/TOTAL
        I: EGRESO/SEXO/V
        J: EGRESO/SEXO/M
    2021: *ii_7_1_2_hasta_2022
    2022: *ii_7_1_2_hasta_2022
    2023:
      motivo: >-
        «INGRESADOS», «MATRICULADOS» y «EGRESADOS» son el «INGRESO», la «MATRÍCULA» y el «EGRESO» de 2024: mismo cuadro y
        misma medida (en 2023 y 2024 la UdelaR viene sin dato de matrícula). Los TOTAL suman su grupo de la derecha.
      columnas:
        B: INGRESO/TOTAL
        C: INGRESO/SEXO/V
        D: INGRESO/SEXO/M
        E: MATRÍCULA/TOTAL
        F: MATRÍCULA/SEXO/V
        G: MATRÍCULA/SEXO/M
        H: EGRESO/TOTAL
        I: EGRESO/SEXO/V
        J: EGRESO/SEXO/M
  II-6.3.2:  # #173: 2020–2022 rotulan el sexo «M/F» (masculino/femenino); 2023–2024, «V/M» (varón/mujer)
    2020: &sexo_m_f_ii_6_3_2
      motivo: >-
        el archivo rotula el sexo «M» (masculino) y «F» (femenino); desde 2023, «V» y «M». En 2020, 5 «M» y 39 «F» de
        44 docentes del CENFORES: «M» es varón. Sin el renombre, la «M» de 2020–2022 (varones) se uniría a la «M» de
        2023–2024 (mujeres).
      columnas:
        D: HORAS SEMANALES/20 horas o menos/SEXO/V
        E: HORAS SEMANALES/20 horas o menos/SEXO/M
        G: HORAS SEMANALES/Entre 21 y 30 horas/SEXO/V
        H: HORAS SEMANALES/Entre 21 y 30 horas/SEXO/M
        J: HORAS SEMANALES/31 horas y más/SEXO/V
        K: HORAS SEMANALES/31 horas y más/SEXO/M
    2021: *sexo_m_f_ii_6_3_2
    2022: *sexo_m_f_ii_6_3_2

# conceptos (D5): rutas que la regla de encabezados (`completar_grupos`) deja mal, en todos los años en que
# aparecen. `suma`: rutas (o prefijos terminados en «/», o finales que empiezan con «*/») cuyas columnas tienen
# que sumar `total` (otra ruta del cuadro) o, si no hay `total`, la columna misma. Se comprueba en cada año y
# fila; `diferencia_explicada` acepta las filas que no cierran por lo que dice el pie, y lo anota.
conceptos:
  II-2.1.4:
    "TIPO DE EDUCACIÓN/Total":
      concepto: TIPO DE EDUCACIÓN/EDUCACIÓN COMÚN/TOTAL  # 2024: 372 = 354 habilitados + 18 autorizados
      suma: ["TIPO DE EDUCACIÓN/EDUCACIÓN COMÚN/"]
  II-1.2.3:
    "MODALIDAD/Total":
      concepto: MODALIDAD/JARDINES PRIVADOS/TOTAL  # 2024: 2.011 = suma de los niveles de jardines privados
      suma: ["MODALIDAD/JARDINES PRIVADOS/"]
      diferencia_explicada:  # filas que no cierran por algo que dice el pie
        2023: "24 estudiantes de jardines privados sin información por edad (pie): 15 en Montevideo y 9 en el resto"
  II-1.2.4:
    "FORMA DE ADMINISTRACIÓN/TOTAL/SEXO/MUJER":
      concepto: TOTAL/SEXO/MUJER  # hermana de C «TOTAL/SEXO/VARÓN»; 2024: 33.791 = 30.834 + 2.957
      suma: ["*/SEXO/M"]  # las mujeres de cada forma de administración
  II-4.2.14:
    "FORMA DE ADMINISTRACIÓN/TOTAL/NO PROMOVIDO/SEXO/Mujer":
      concepto: TOTAL/NO PROMOVIDO/SEXO/Mujer  # hermana de F «TOTAL/NO PROMOVIDO/SEXO/Varón»
      total: TOTAL/NO PROMOVIDO/TOTAL
      suma: ["TOTAL/NO PROMOVIDO/SEXO/", "FORMA DE ADMINISTRACIÓN/TOTAL/NO PROMOVIDO/SEXO/Mujer"]
  II-1.2.5:
    "Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato":
      concepto: FORMA DE ADMINISTRACIÓN/Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato
      total: TOTAL
      suma: ["FORMA DE ADMINISTRACIÓN/", "Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato"]

# reagrupaciones (D6): categorías de 2020–2023 que el anuario 2024 agrupa en otra. Decisión del mantenedor
# (2026-11-23): cada una conserva su indicador, tal como se publicó, con esta nota; nunca se suman.
reagrupaciones:
  II-1.2.1: &jardines
    jardin comun: "2024 la agrupa con «Jardín de Ciclo Inicial» en «JARDÍN DE INFANTES»"
    jardin de ciclo inicial: "2024 la agrupa con «Jardín común» en «JARDÍN DE INFANTES»"
    jardin de jornada comun y completa: "2024 publica por separado «JARDÍN DE INFANTES» y «JARDÍN DE JORNADA COMPLETA»"
    comun: &escuelas "2024 reclasifica las escuelas en «URBANA COMÚN», «RURAL», «TIEMPO COMPLETO» y «TIEMPO EXTENDIDO»"
    con maestro a cargo: *escuelas
    de practica: *escuelas
    habilitada de practica: *escuelas
    internado rural: *escuelas
    t.extendido-de practica: *escuelas
    unidocente: *escuelas
    de tiempo completo: *escuelas
  II-1.2.2: *jardines

# desgloses_extra (F4.5a, AC-E19): partes de un total que el encabezado no dice (rutas del archivo o conceptos).
desgloses_extra:
  II-3.2.10:  # #196: el total de cada sexo y resultado = la suma de los tipos de curso (2024 no cierra y no se carga)
    - total: RENDIMIENTO/Promovido/SEXO/Varón
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/Promovido/SEXO/Varón", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/Promovido/SEXO/Varón", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/Promovido/SEXO/Varón"]
    - total: RENDIMIENTO/Promovido/SEXO/Mujer
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/Promovido/SEXO/Mujer", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/Promovido/SEXO/Mujer", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/Promovido/SEXO/Mujer"]
    - total: RENDIMIENTO/No Promovido/SEXO/Varón
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/No promovido/SEXO/Varón", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/No promovido/SEXO/Varón", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/No promovido/SEXO/Varón"]
    - total: RENDIMIENTO/No Promovido/SEXO/Mujer
      partes: ["TIPO DE CURSO/ARTICULACIÓN EDUCACIÓN MEDIA BÁSICA/RENDIMIENTO/No promovido/SEXO/Mujer", "TIPO DE CURSO/EDUCACION BASICA INTEGRADA/RENDIMIENTO/No promovido/SEXO/Mujer", "TIPO DE CURSO/FORMACIÓN PROFESIONAL BÁSICA/RENDIMIENTO/No promovido/SEXO/Mujer"]
  II-1.2.4:  # el TOTAL es varones + mujeres + los «sin dato» de CPIP (columna dentro de CPIP)
    - total: TOTAL
      partes: ["TOTAL/SEXO/VARÓN", "TOTAL/SEXO/MUJER", "FORMA DE ADMINISTRACIÓN/Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato"]
  II-3.3.2:  # #233: con GÉNERO (2023–), el TOTAL de cada fila es varones + mujeres + trans
    - total: TOTAL
      partes: ["GÉNERO/Varones", "GÉNERO/Mujeres", "GÉNERO/Trans"]
  II-4.3.2:  # #233: ídem (2024–)
    - total: TOTAL
      partes: ["GÉNERO/Varones", "GÉNERO/Mujeres", "GÉNERO/Trans"]
  II-1.2.5:  # #233: como II-1.2.4, en cada fila (edad): el TOTAL es varones + mujeres + los «sin dato» de sexo, que el cuadro
    # publica solo dentro de CPIP (2021–) y de la privada DGEIP (2023–). Con las dos columnas manda la segunda declaración.
    - total: TOTAL
      partes: ["SEXO/V", "SEXO/M", "FORMA DE ADMINISTRACIÓN/Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato"]
    - total: TOTAL
      partes: ["SEXO/V", "SEXO/M", "FORMA DE ADMINISTRACIÓN/DGEIP-PRIVADOS (Habilitados y Autorizados)/SEXO/Sin dato", "FORMA DE ADMINISTRACIÓN/Centros de Primera Infancia Privados (CPIP)/SEXO/Sin dato"]

  II-6.2.1:  # #173: el total de cada movimiento = Magisterio + Profesorado + Educador Social
    - total: TOTAL/Ingr.
      partes: ["CARRERA/Magisterio/Ingr.", "CARRERA/Profesorado/Ingr.", "CARRERA/Educador Social/Ingr."]
    - total: TOTAL/Matr.
      partes: ["CARRERA/Magisterio/Matr.", "CARRERA/Profesorado/Matr.", "CARRERA/Educador Social/Matr."]
    - total: TOTAL/Egr.
      partes: ["CARRERA/Magisterio/Egr.", "CARRERA/Profesorado/Egr.", "CARRERA/Educador Social/Egr."]
