        información disponible que corresponden al año 2020, dado que al momento de cierre de la publicación no estaba el dato correspondiente a 2021'
      2022:
      - 'Primaria Privada: Se carece de datos desagregados por edad y sexo. El total por grado corresponde a datos adminstrativos 2022, pero la desagregación por
        edad y sexo fue prorateada a partir de los últimos datos disponibles que corresponden al año 2016.'
